name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # A queued run builds the latest main, including earlier queued merges.
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:package
      - run: npm test

      - name: Commit verified plugin bundles
        id: bundles
        run: |
          source_sha="$(git rev-parse HEAD)"
          git add -- dist
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "build: regenerate plugin bundles"
          fi
          # Generated output is never rebased or forced. If a newer merge moved
          # main past the source this run built, that merge's queued run
          # rebuilds and releases both, so this run stands down successfully.
          if git push origin HEAD:main; then
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$source_sha" ] && git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "::notice::main moved past ${source_sha}; the queued release run for $(git rev-parse --short origin/main) releases this change."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit 1
      - name: Verify committed bundle reproducibility
        if: steps.bundles.outputs.superseded != 'true'
        run: |
          npm run build:mcp-bundle
          test -z "$(git status --porcelain -- dist)"

      - uses: Extra-Chill/homeboy-action@v2
        id: release
        if: steps.bundles.outputs.superseded != 'true'
        with:
          extension: nodejs
          component: data-liberation-agent
          commands: release
          # The GitHub Release carries the `npm pack` tarball as its asset
          # (homeboy.json binds the nodejs packager). This package is not
          # published to the npm registry; homeboy.json also disables it.
          release-skip-publish: 'true'
