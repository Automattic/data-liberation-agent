name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep generated bundles out of pull requests
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A retargeted PR can retain an old API base SHA. Compare against the
          # actual common ancestor so main-owned release bundles are inherited,
          # while any bundle changes authored on the feature branch still fail.
          BASE_SHA=$(git merge-base "$HEAD_SHA" "origin/$BASE_REF")
          if ! git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- dist; then
            echo "dist/ is maintained on main by the Release workflow. Restore generated changes to the PR merge-base before committing."
            git diff --stat "${BASE_SHA}...${HEAD_SHA}" -- dist
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Verify skill driver coverage
        run: |
          missing_drivers=$(grep -rhoE 'run\.mjs [a-z0-9_-]+' skills 2>/dev/null | awk '{print $2}' | sort -u | while read -r name; do
            [[ -f "dist/scripts/${name}.mjs" ]] || echo "$name"
          done)
          if [[ -n "$missing_drivers" ]]; then
            echo "Skills invoke drivers with no committed bundle: ${missing_drivers}"
            exit 1
          fi
      - run: npm run test:package

  test-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx vitest run --shard=${{ matrix.shard }}/4

  test:
    if: always()
    needs: [checks, test-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Require checks and all test shards to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          SHARDS_RESULT: ${{ needs.test-shard.result }}
        run: |
          if [[ "$CHECKS_RESULT" != "success" || "$SHARDS_RESULT" != "success" ]]; then
            echo "checks: $CHECKS_RESULT; test shards: $SHARDS_RESULT"
            exit 1
          fi
