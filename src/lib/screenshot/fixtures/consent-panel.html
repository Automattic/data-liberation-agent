<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;font-family:sans-serif;min-height:200vh}
#cs-banner{position:fixed;inset:0;z-index:99;display:flex;align-items:flex-end;justify-content:flex-start;pointer-events:none;background:transparent;color:#b1b1b1}
#cs-banner .cs-panel{position:relative;bottom:0;pointer-events:auto;margin:16px;max-width:520px;background:#fff;color:#333;border-radius:16px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
#cs-banner .cs-actions{display:flex;gap:8px;margin-top:16px}
#cs-banner button{border:0;border-radius:64px;padding:8px 32px;background:#3c4059;color:#fff}
</style></head><body><main><h1>Page</h1><p>This page explains what the site offers and how visitors can find their way around.</p></main>
<!-- Extra page copy keeps the fixed banner from holding the page's whole text;
the overlay detector drops a fixed element whose text is the entire page. -->
<div id="cs-banner" role="dialog" aria-label="Cookie consent"><div class="cs-panel">
<p class="cs-text">We collect personal information as specified in the <a href="https://example.test/privacy-policy/">privacy policy</a> and use cookies as specified in the <a href="https://example.test/cookie-policy/">cookie policy</a>. You can change your choice in the <a href="#prefs">preferences panel</a>.</p>
<div class="cs-actions"><button type="button">Reject</button><button type="button">Accept</button></div>
</div></div></body></html>
