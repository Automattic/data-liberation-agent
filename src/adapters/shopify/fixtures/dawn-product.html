<!doctype html>
<html class="js" lang="en">
<head>
  <title>Woven throw</title>
  <link rel="canonical" href="https://shop.example/products/woven-throw">
  <script>Shopify.shop = "neutral.myshopify.com"; Shopify.theme = {"schema_name":"Local Craft"};</script>
</head>
<body class="gradient">
  <header id="shopify-section-header">Local Craft</header>
  <main id="MainContent" role="main">
    <section id="shopify-section-template--1__main" class="shopify-section">
      <!-- Neutral server HTML following Dawn main-product and product-media-gallery structure. -->
      <product-info id="MainProduct-template--1__main" data-section="template--1__main" data-product-id="1" data-url="/products/woven-throw">
        <div class="product grid">
          <div class="product__media-wrapper">
            <media-gallery id="MediaGallery-template--1__main" role="region">
              <slider-component>
                <ul class="product__media-list grid slider">
                  <li class="product__media-item"><img src="/cdn/shop/files/throw.jpg" alt="Woven throw"></li>
                </ul>
              </slider-component>
            </media-gallery>
          </div>
          <div class="product__info-wrapper">
            <section id="ProductInfo-template--1__main" class="product__info-container">
              <div class="product__title"><h1>Woven throw</h1></div>
              <div role="status">$24.00</div>
              <div class="product__description">A soft woven cotton throw.</div>
              <form action="/cart/add"><button onclick="purchase()">Add to cart</button></form>
            </section>
          </div>
        </div>
      </product-info>
    </section>
  </main>
</body>
</html>
