<!doctype html><html class="page-closed"><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0}button{padding:16px}.drawer{position:absolute;top:60px;left:0;width:100%;height:240px;background:white}.nav-closed .drawer{display:none!important}.page-closed .drawer a{visibility:hidden!important}
</style></head><body class="nav-closed persistent"><main><h1>Root gated navigation</h1><div><div><div><div><div><div><div><div><div><button id="toggle" aria-controls="drawer" aria-expanded="false" aria-haspopup="menu">Menu</button></div></div></div></div></div></div></div></div></div><nav id="drawer" class="drawer" aria-label="Site"><a href="#content">First</a><a href="#content">Second</a><a href="#content">Third</a><a href="#content">Fourth</a><a href="#content">Fifth</a></nav><section id="content">Page content</section></main>
<script>const toggle=document.querySelector('#toggle');function set(open){toggle.setAttribute('aria-expanded',String(open));document.body.classList.toggle('nav-open',open);document.body.classList.toggle('nav-closed',!open);document.documentElement.classList.toggle('page-open',open);document.documentElement.classList.toggle('page-closed',!open);}toggle.onclick=()=>set(toggle.getAttribute('aria-expanded')!=='true');addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});</script></body></html>
